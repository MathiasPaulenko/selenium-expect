[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-expect"
version = "1.0.0"
description = "Playwright-style expect() assertions with auto-retry for Selenium Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mathias Paulenko", email = "mathias.paulenko@outlook.com" }]
keywords = ["selenium", "expect", "assertions", "testing", "retry", "playwright"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "selenium>=4.10",
]

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/selenium-expect"
Repository = "https://github.com/MathiasPaulenko/selenium-expect"
Issues = "https://github.com/MathiasPaulenko/selenium-expect/issues"
Documentation = "https://mathiaspaulenko.github.io/selenium-expect/"
Changelog = "https://github.com/MathiasPaulenko/selenium-expect/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-include-markdown-plugin>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["selenium_expect"]

[tool.hatch.build.targets.wheel.force-include]
"selenium_expect/py.typed" = "selenium_expect/py.typed"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["selenium_expect", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["selenium_expect"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["selenium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["tests", "."]
markers = [
    "integration: marks tests as integration tests requiring a browser (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["selenium_expect"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
