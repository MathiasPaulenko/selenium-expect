name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          python - <<'EOF'
          import re, sys, tomllib

          tag = "${{ github.ref_name }}".removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init_src = open("selenium_expect/__init__.py", encoding="utf-8").read()
          init_version = re.search(r'__version__\s*=\s*"([^"]+)"', init_src).group(1)

          if tag != version:
              sys.exit(f"tag {tag} does not match pyproject.toml version {version}")
          if version != init_version:
              sys.exit(f"pyproject.toml {version} != __init__.py {init_version}")
          EOF
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*
